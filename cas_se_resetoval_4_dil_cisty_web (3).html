<script>
const chapters = [
  {"title":"TRVALO VÁM TO","paras":["„Trvalo vám to.“","Patrik zvedl hlavu. Hlas přišel z chodby, ale nikdo tam nebyl.","Na zdi stále svítilo 20:28. Jenže tentokrát se nic neresetovalo.","Vojta se podíval na Adama. „Takže… RÍŠA čeká.“","Lukáš zbledl. „On ví, že jsme tady.“","Na dveřích se objevila věta: RÍŠA ČEKÁ.","Patrik sáhl na kliku. V tu chvíli světlo zhaslo.","A když se znovu rozsvítilo, postava v místnosti byla pryč."]},
  {"title":"RÍŠA","paras":["„Musíme najít RÍŠU,“ řekl Adam.","Lukáš mlčel.","„Ty něco víš, že jo?“ zeptal se Patrik.","„Znám RÍŠU déle, než si myslíte.“","„Jak dlouho?“","„Od prvního dne, kdy jsem byl v tomhle domě.“","Vojta se zarazil. „Ty jsi tu byl už před námi?“","Lukáš přikývl.","„A RÍŠA tam byl taky.“"]},
  {"title":"PRVNÍ VZPOMÍNKA","paras":["„Bylo to před rokem,“ začal Lukáš.","„Jednou jsem se probudil a na telefonu jsem měl jedinou adresu. Tenhle dům.“","„Přišel jsem sem. A uvnitř seděl RÍŠA.“","„Sám?“","Lukáš zavrtěl hlavou. „Ne.“","„Byl tam ještě někdo.“","„Kdo?“","Lukáš si položil ruku na čelo.","„Nevím.“","„Jak to můžeš nevědět?“","„Protože pokaždé, když si na něj vzpomenu… ta vzpomínka zmizí.“"]},
  {"title":"STŮL","paras":["V další místnosti stál starý dřevěný stůl.","Na jeho desce byla vyrytá čísla:","28","21:21","21:30","22:00","20:28","Pod nimi stálo: RÍŠA — 5. MÍSTO","Patrik si všiml dalších pěti postav nakreslených na papíře.","Čtyři byly přeškrtnuté.","TEN, KTERÝ SI PAMATUJE, SE NESMÍ VRÁTIT."]},
  {"title":"ZVUK ZE ŠKOLY","paras":["Najednou se domem rozezněl školní zvonek.","Všichni ztuhli.","Patrikův telefon se rozsvítil.","7:31","ZÁKLADNÍ ŠKOLA CHVALTICE","TŘÍDA 9.A","Na displeji se objevila fotografie jejich třídy.","KDO BYL PRVNÍ?","Datum fotografie: 14.10.2025.","Lukáš se na obrazovku dlouze díval.","„Já tam byl.“"]},
  {"title":"TŘÍDA 9.A","paras":["Najednou se všechno kolem nich změnilo.","Už nebyli v domě.","Stáli ve své třídě.","Byla stejná jako ve škole 14.10.2025.","Na jednom stole bylo vyryto: P + V + A + L","Patrik přejel prstem po písmenách.","„Patrik, Vojta, Adam, Lukáš…“","Vojta ukázal na tabuli.","Uprostřed bylo jediné písmeno: R"]},
  {"title":"VIDEO","paras":["Na učitelském stole ležel starý telefon.","Našel se v něm jediný soubor.","14.10.2025 — 20:28","Patrik video spustil.","Na záznamu byl mladší Lukáš.","Vedle něj stála neznámá postava.","Video skončilo.","Na displeji se objevila zpráva: CHCETE VĚDĚT, KDO TO BYL?","Patrik napsal: ANO.","Odpověď přišla okamžitě: TAK SE ZEPTEJTE RÍŠI."]},
  {"title":"TELEFONÁT","paras":["Patrik vytočil RÍŠU.","Telefon zazvonil jen jednou.","„Vy jste to zase spustili,“ ozval se RÍŠA.","„Co?“","„Čas.“","„Kdo byl ten pátý?“","Chvíli bylo ticho.","„Já.“","Všichni se na sebe podívali.","„Co tím myslíš?“","RÍŠA zavěsil."]},
  {"title":"PÁTÉ MÍSTO","paras":["Na tabuli se objevilo nové označení: RÍŠA = 4","Patrik se otočil.","„Ale my jsme čtyři.“","Lukáš odpověděl: „Právě.“","Světla zhasla.","Ve tmě zazněl Patrikův vlastní hlas: „Jeden z vás pořád chybí.“"]},
  {"title":"CHYBĚJÍCÍ","paras":["Na stole se objevila fotografie.","Patrik. Vojta. Adam. Lukáš. RÍŠA.","A za nimi ještě někdo.","Na zadní straně fotografie stálo: NECHYBÍ. JEN HO NEVIDÍTE.","14.10.2025","ZAČALO TO VE ŠKOLE."]},
  {"title":"NÁVRAT","paras":["Zazvonil školní zvonek.","Obraz kolem nich se rozmazal.","V další vteřině stáli znovu v domě číslo 28.","Na zdi svítilo 20:28.","Na telefonech se objevily tři zprávy:","NEZAČALO TO V DOMĚ.","NEZAČALO TO V LESE.","ZAČALO TO VE ŠKOLE.","Pak přišla poslední:","NECHOĎTE TAM ZÍTRA.","PROTOŽE TAM UŽ JSTE."]},
  {"title":"20:29","paras":["Všichni sledovali hodiny.","20:28","20:29","Patrik čekal, že se všechno vrátí zpět.","Nic.","20:30","„Reset nepřijde,“ řekl Lukáš.","20:31","„Konec,“ zašeptal.","Na zdi se objevila poslední zpráva:","RÍŠA VÍ, KDO BYL PRVNÍ.","A pod ní:","PRVNÍ UŽ VÍ, ŽE HO HLEDÁTE."]}
];

let currentChapter = 0;
let fontSize = 100;

function escapeText(text) {
  return String(text).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}

function openChapter(i) {
  currentChapter = i;
  document.getElementById("list").style.display = "none";
  document.getElementById("reader").style.display = "block";

  const c = chapters[i];
  document.getElementById("content").innerHTML =
    '<article class="chapter">' +
    '<div class="num">KAPITOLA ' + (i + 1) + '</div>' +
    '<h2>' + escapeText(c.title) + '</h2>' +
    '<div class="story">' +
    c.paras.map(p => '<p>' + escapeText(p) + '</p>').join("") +
    '</div></article>';

  updateNavigation();
  applyFontSize();
  window.scrollTo(0,0);
}

function closeChapter() {
  document.getElementById("reader").style.display = "none";
  document.getElementById("list").style.display = "block";
  window.scrollTo(0,0);
}

function previousChapter() {
  if (currentChapter > 0) openChapter(currentChapter - 1);
}

function nextChapter() {
  if (currentChapter < chapters.length - 1) openChapter(currentChapter + 1);
}

function updateNavigation() {
  document.getElementById("prevBtn").disabled = currentChapter === 0;
  document.getElementById("nextBtn").disabled = currentChapter === chapters.length - 1;
}

function changeFontSize(direction) {
  fontSize = Math.max(80, Math.min(140, fontSize + direction * 10));
  document.getElementById("sizeLabel").textContent = fontSize + " %";
  applyFontSize();
}

function applyFontSize() {
  const story = document.querySelector("#content .story");
  if (story) story.style.fontSize = (19 * fontSize / 100) + "px";
}
</script></body></html>
